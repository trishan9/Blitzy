name: ci
on:
  push: { branches: [main] }
  pull_request: {}

permissions:
  contents: read

jobs:

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITLEAKS_VERSION: latest }

  semgrep:
    runs-on: ubuntu-latest
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@v7
      - run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/nodejs \
            --config=p/owasp-top-ten \
            --severity=ERROR \
            --error \
            --metrics=off \
            --exclude=node_modules --exclude=dist --exclude=docs

  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.3.8 \
            scan source --lockfile=/src/backend/package-lock.json

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: ecommerce }
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
      mongo:
        image: mongo:7
        ports: ["57017:27017"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npx tsc --noEmit
      - name: bootstrap db (roles + every migration in order)
        working-directory: backend
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -p 55433 -U postgres -d ecommerce -v ON_ERROR_STOP=1 \
            -v rw_pw=rwpass -v ro_pw=ropass -v mig_pw=migpass -f ../infra/postgres/db-setup.sql
          for f in src/db/migrations/*.sql; do
            echo "applying $f"
            PGPASSWORD=migpass psql -h localhost -p 55433 -U migrator -d ecommerce \
              -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: offline suite
        working-directory: backend
        run: npm run verify
      - name: live + e2e suite
        working-directory: backend
        env:
          PGHOST: localhost
          PGPORT: 55433
          PGPW_MIG: migpass
          PGPW_RW: rwpass
          REDIS_URL: redis://localhost:56379
          MONGO_URI: mongodb://localhost:57017/activity_log
          DATABASE_URL: postgres://app_rw:rwpass@localhost:55433/ecommerce
          BETTER_AUTH_URL: http://localhost:8000
          APP_URL: http://localhost:8000
          FRONTEND_ORIGIN: http://localhost:5173
          BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:5173
          JWT_ISS: http://localhost:8000
          JWT_AUD: ecommerce-api
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -base64 36)"
          export CRYPTO_MASTER_KEY="$(openssl rand -base64 32)"
          export BLIND_INDEX_PEPPER="$(openssl rand -hex 16)"
          export GUEST_CART_SECRET="$(openssl rand -hex 16)"
          npm run verify:live && npm run demo:pairs

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build api image
        run: docker build -t ecommerce-api:ci backend
      - name: scan the image, fail on HIGH or CRITICAL
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            aquasec/trivy:0.72.0 image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile backend/.trivyignore \
              --exit-code 1 \
              ecommerce-api:ci
      - name: software bill of materials
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            aquasec/trivy:0.72.0 image \
              --format cyclonedx \
              --output sbom.cdx.json \
              ecommerce-api:ci
      - uses: actions/upload-artifact@v7
        with: { name: sbom, path: sbom.cdx.json }
