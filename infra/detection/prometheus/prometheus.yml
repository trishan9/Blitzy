global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels: { deployment: "host-dev" }
      - targets: ["api:8000"]
        labels: { deployment: "container" }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
